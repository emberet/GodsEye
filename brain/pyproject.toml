[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "godseye-brain"
version = "0.1.0"
description = "GodsEye brain: research, market simulator and reinforcement-learning copy policy, trained on the owner's Mac"
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "duckdb>=1.0", "scikit-learn>=1.4", "lightgbm>=4", "onnx>=1.16", "onnxruntime>=1.18", "pyyaml>=6", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
