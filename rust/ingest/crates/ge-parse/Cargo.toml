[package]
name = "ge-parse"
description = "GodsEye swap parsing and bot-sign features: a byte-for-byte port of agent/src/chain/parse.ts and agent/src/stream/convert.ts"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu-js = "1"
five8 = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false
