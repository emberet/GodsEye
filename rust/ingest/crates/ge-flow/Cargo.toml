[package]
name = "ge-flow"
description = "GodsEye offline analysis: copy-replay backtest kernel and money-flow / funder-graph clustering over the SQLite DB (read-only source, never signs)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "replay"
harness = false
